<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- мягкая тень под «листами» -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- лёгкое зерно, чтобы градиенты не шли полосами -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>

    <radialGradient id="base" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>

    <!-- нижний левый лист: светлее у гребня -->
    <linearGradient id="sheetL" x1="0.35" y1="0.15" x2="0.2" y2="0.9">
      <stop offset="0" stop-color="#727270"/>
      <stop offset="0.3" stop-color="#3c3c3b"/>
      <stop offset="0.75" stop-color="#141414"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>

    <!-- большой холм справа -->
    <linearGradient id="hill" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#686866"/>
      <stop offset="0.35" stop-color="#343433"/>
      <stop offset="0.8" stop-color="#121212"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>

    <!-- тёмная «капля» слева сверху -->
    <radialGradient id="blob" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.8" stop-color="#050505"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </radialGradient>

    <!-- лента по центру -->
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.55" stop-color="#8a8a88"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>

    <!-- блик на кромке -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#d8d8d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- виньетка по краям -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <!-- фон -->
  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- дальняя дуга справа сверху -->
  <path d="M1580 0 C1600 260 1760 560 1920 700 L1920 0 Z" fill="#0b0b0b"/>
  <path d="M1580 0 C1600 260 1760 560 1920 700" fill="none" stroke="#3a3a3a" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

  <!-- большая тёмная капля слева сверху -->
  <path d="M-80 -60 L900 -60 C860 120 900 300 760 420 C600 560 300 520 120 470 C-20 430 -80 380 -80 300 Z"
        fill="#000" filter="url(#shadow)" opacity="0.9" transform="translate(0 30)"/>
  <path d="M-80 -60 L900 -60 C860 120 900 300 760 420 C600 560 300 520 120 470 C-20 430 -80 380 -80 300 Z"
        fill="url(#blob)"/>

  <!-- нижний левый лист, поднимающийся к центру -->
  <path d="M-60 1140 L-60 730 C160 660 360 610 560 570 C700 540 780 460 820 330
           C850 220 870 100 880 -40 L900 -40 C890 160 870 380 880 560 C890 720 960 900 1020 1140 Z"
        fill="#000" filter="url(#shadow)" opacity="0.85" transform="translate(-20 -30)"/>
  <path d="M-60 1140 L-60 730 C160 660 360 610 560 570 C700 540 780 460 820 330
           C850 220 870 100 880 -40 L900 -40 C890 160 870 380 880 560 C890 720 960 900 1020 1140 Z"
        fill="url(#sheetL)"/>
  <!-- кромка листа -->
  <path d="M-60 730 C160 660 360 610 560 570 C700 540 780 460 820 330 C850 220 870 100 880 -40"
        fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/>

  <!-- тонкая светлая линия, спускающаяся к низу по центру -->
  <path id="line" d="M1180 -40 C1150 190 1040 310 975 440 C900 590 905 760 965 900 C1010 1000 1030 1060 1040 1120"
        fill="none" stroke="#bdbdbb" stroke-width="16" opacity="0.07" filter="url(#soft)"/>
  <path d="M1180 -40 C1150 190 1040 310 975 440 C900 590 905 760 965 900 C1010 1000 1030 1060 1040 1120"
        fill="none" stroke="url(#ribbon)" stroke-width="2.2" opacity="0.9"/>

  <!-- большой холм справа снизу -->
  <path d="M780 1140 C860 880 1000 720 1200 690 C1400 660 1560 740 1700 860 C1800 950 1880 1040 1980 1140 Z"
        fill="#000" filter="url(#shadow)" opacity="0.9" transform="translate(-30 -20)"/>
  <path d="M780 1140 C860 880 1000 720 1200 690 C1400 660 1560 740 1700 860 C1800 950 1880 1040 1980 1140 Z"
        fill="url(#hill)"/>
  <path d="M800 1080 C870 870 1010 725 1200 694 C1340 672 1460 700 1560 750"
        fill="none" stroke="url(#edge)" stroke-width="2.5" filter="url(#glow)" opacity="0.8"/>

  <!-- мягкий свет на гребнях -->
  <ellipse cx="620" cy="600" rx="260" ry="90" fill="#8a8a88" opacity="0.10" filter="url(#shadow)" transform="rotate(-18 620 600)"/>
  <ellipse cx="1260" cy="760" rx="300" ry="80" fill="#8a8a88" opacity="0.10" filter="url(#shadow)" transform="rotate(-4 1260 760)"/>

  <!-- виньетка и зерно -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
